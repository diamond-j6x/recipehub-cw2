name: CD - Deploy RecipeHub

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir site
          ls -la
          find . -maxdepth 1 -name "*Multimedia*.html"
          cp "$(find . -maxdepth 1 -name '*Multimedia*.html' | head -n 1)" site/index.html
          cp -r CSS JS site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
