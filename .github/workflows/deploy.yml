name: CD - Deploy RecipeHub

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare site files
        shell: bash
        run: |
          set -e
          echo "Repo root contents:"
          ls -la

          echo "Searching for Multimedia App html file..."
          FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*multimedia*app*.html" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "Multimedia App file not found!"
            exit 1
          fi

          echo "Found homepage file: $FILE"

          mkdir -p site
          cp "$FILE" site/index.html
          cp -r CSS JS site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
